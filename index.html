
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo dõi Công tác Tổ - v2.9</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; line-height: 1.6; max-width: 850px; margin: 0 auto; padding: 20px; background-color: #f0f2f5; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .version { font-size: 0.8em; color: #999; text-align: right; margin-bottom: 10px; }
        h1 { color: #1e3a8a; text-align: center; margin-bottom: 20px; font-size: 1.4em; }
        .today-card { background: #fff; border: 2px solid #3b82f6; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .date-title { color: #2563eb; font-weight: bold; font-size: 1.3em; margin-bottom: 15px; display: block; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .work-item { background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #10b981; white-space: pre-line; }
        .import-zone { background: #fffbeb; padding: 20px; border-radius: 12px; border: 1px solid #fef3c7; margin-top: 30px; }
        .preview-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.85em; }
        .preview-table th, .preview-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        .preview-table th { background: #f3f4f6; }
        .btn { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        #status { font-weight: bold; color: #b45309; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="version">Version: 2.9 (2026-01-03)</div>
    <h1>Lịch Công Tác Tổ</h1>

    <div class="today-card">
        <span class="date-title" id="currentDateDisplay">Đang tải...</span>
        <div id="displayArea">Đang kết nối dữ liệu...</div>
    </div>

    <div class="import-zone">
        <strong>Cập nhật File (.xlsx) - Lấy dữ liệu từ dòng 10</strong><br><br>
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        <div id="status"></div>
        
        <div id="previewContainer" style="display:none">
            <p><b>Dữ liệu trích xuất được (Vui lòng kiểm tra trước khi lưu):</b></p>
            <table class="preview-table" id="previewTable">
                <thead><tr><th>Cột A (Thứ)</th><th>Nội dung trích xuất</th></tr></thead>
                <tbody></tbody>
            </table>
            <button id="btnConfirm" class="btn">XÁC NHẬN LƯU LỊCH NÀY</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCzWjfcD5Dgq7V-i2izb9tKLR6QM6qWPQo", 
        authDomain: "tavietnam-78ae8.firebaseapp.com", 
        projectId: "tavietnam-78ae8", 
        databaseURL: "https://tavietnam-78ae8-default-rtdb.firebaseio.com",
        storageBucket: "tavietnam-78ae8.firebasestorage.app", 
        messagingSenderId: "670121705534", 
        appId: "1:670121705534:web:1027ad98550573ad37116f" 
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let parsedData = [];

    const daysOfWeek = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];

    function loadFromFirebase() {
        const now = new Date();
        const todayName = daysOfWeek[now.getDay()];
        document.getElementById('currentDateDisplay').innerText = todayName + ", " + now.toLocaleDateString('vi-VN');

        db.ref('currentWeekSchedule').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) renderTodaySchedule(data, todayName);
            else document.getElementById('displayArea').innerHTML = "Chưa có dữ liệu trong hệ thống.";
        });
    }

    function renderTodaySchedule(data, todayName) {
        let html = "";
        let found = false;
        const dataArr = Array.isArray(data) ? data : Object.values(data);
        dataArr.forEach(item => {
            if ((item.day || "").toString().toLowerCase().includes(todayName.toLowerCase())) {
                html += `<div class="work-item">${item.content}</div>`;
                found = true;
            }
        });
        document.getElementById('displayArea').innerHTML = found ? html : "Hôm nay không có lịch.";
    }

    document.getElementById('excelFile').onchange = function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(evt) {
            const workbook = XLSX.read(evt.target.result, { type: 'binary' });
            let targetSheetName = workbook.SheetNames.find(name => name.toUpperCase().startsWith("DKKHC")) || workbook.SheetNames[0];
            const sheet = workbook.Sheets[targetSheetName];
            
            // Đọc dạng mảng để giữ đúng số thứ tự dòng
            const rawData = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
            
            parsedData = [];
            const tbody = document.querySelector("#previewTable tbody");
            tbody.innerHTML = "";

            // Duyệt từ dòng 10 (index 9) đến hết
            for (let i = 9; i < rawData.length; i++) {
                const row = rawData[i];
                if (!row || row.length === 0) continue;

                const colA = row[0] ? row[0].toString().trim() : "";
                const content = row.slice(1).map(c => c.toString().trim()).filter(c => c !== "").join(" | ");

                if (colA !== "" || content !== "") {
                    if (colA !== "") {
                        parsedData.push({ day: colA, content: content });
                    } else if (parsedData.length > 0) {
                        parsedData[parsedData.length - 1].content += "\n" + content;
                    }
                    
                    // Thêm vào bảng xem trước để người dùng kiểm tra
                    const tr = document.createElement("tr");
                    tr.innerHTML = `<td>${colA}</td><td>${content}</td>`;
                    tbody.appendChild(tr);
                }
            }

            if (parsedData.length > 0) {
                document.getElementById('previewContainer').style.display = "block";
                document.getElementById('status').innerText = `✅ Đã đọc xong Sheet: ${targetSheetName}`;
            } else {
                document.getElementById('status').innerText = "❌ Không tìm thấy dữ liệu từ dòng 10. Vui lòng kiểm tra lại file.";
            }
        };
        reader.readAsBinaryString(file);
    };

    document.getElementById('btnConfirm').onclick = function() {
        db.ref('currentWeekSchedule').set(parsedData).then(() => {
            alert("Đã lưu thành công!");
            location.reload();
        });
    };

    loadFromFirebase();
</script>

</body>
</html>
