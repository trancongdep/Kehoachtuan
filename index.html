
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo dõi Công tác Tổ - v2.2</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; max-width: 900px; margin: 0 auto; padding: 20px; background-color: #f0f2f5; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; text-align: center; margin-bottom: 5px; }
        .version { font-size: 0.85em; color: #65676b; text-align: right; margin-bottom: 20px; }
        .today-box { background: #ffffff; border: 2px solid #1a73e8; padding: 25px; margin: 20px 0; border-radius: 12px; position: relative; }
        .today-tag { position: absolute; top: -15px; left: 20px; background: #1a73e8; color: white; padding: 2px 15px; border-radius: 20px; font-weight: bold; }
        .today-date { font-weight: bold; color: #1a73e8; font-size: 1.4em; display: block; margin-bottom: 10px; }
        #workContent { font-size: 1.1em; color: #333; white-space: pre-wrap; }
        .admin-section { margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 10px; border: 1px solid #e0e0e0; }
        .file-input-wrapper { margin: 15px 0; }
        button { background-color: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button:hover { background-color: #1557b0; }
        .hidden { display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f1f3f4; }
    </style>
</head>
<body>

<div class="container">
    <div class="version">Version: 2.2 (2026-01-03)</div>
    <h1>LỊCH CÔNG TÁC TỔ</h1>

    <div id="displaySection" class="today-box">
        <span class="today-tag">Hôm nay</span>
        <span class="today-date" id="currentDateDisplay">Đang tải...</span>
        <div id="workContent">Đang kiểm tra lịch công tác...</div>
    </div>

    <div class="admin-section">
        <h3>Quản lý Lịch Tuần</h3>
        <div class="file-input-wrapper">
            <label for="excelFile">Import từ file Excel (.xlsx): </label>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
        </div>
        <div id="previewArea" class="hidden">
            <p><strong>Bản xem trước dữ liệu:</strong></p>
            <div id="tablePreview"></div>
            <br>
            <button onclick="saveToFirebase()">Xác nhận và Lưu Lịch</button>
        </div>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = { 
        apiKey: "AIzaSyCzWjfcD5Dgq7V-i2izb9tKLR6QM6qWPQo", 
        authDomain: "tavietnam-78ae8.firebaseapp.com", 
        projectId: "tavietnam-78ae8", 
        storageBucket: "tavietnam-78ae8.firebasestorage.app", 
        messagingSenderId: "670121705534", 
        appId: "1:670121705534:web:1027ad98550573ad37116f" 
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let tempScheduleData = null;

    const daysOfWeek = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];

    // Xử lý đọc file Excel
    document.getElementById('excelFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        const reader = new FileReader();

        reader.onload = function(evt) {
            const data = evt.target.result;
            const workbook = XLSX.read(data, { type: 'binary' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // Chuyển thành JSON (mảng các hàng)
            const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            tempScheduleData = json;

            // Hiển thị bản xem trước
            displayPreview(json);
        };
        reader.readAsBinaryString(file);
    });

    function displayPreview(data) {
        let html = "<table>";
        data.slice(0, 10).forEach(row => {
            html += "<tr>" + row.map(cell => `<td>${cell || ''}</td>`).join('') + "</tr>";
        });
        html += "</table>";
        document.getElementById('tablePreview').innerHTML = html;
        document.getElementById('previewArea').classList.remove('hidden');
    }

    function saveToFirebase() {
        if (!tempScheduleData) return;
        
        db.ref('weeklyScheduleData').set(tempScheduleData).then(() => {
            alert("Đã lưu lịch công tác mới!");
            document.getElementById('previewArea').classList.add('hidden');
            location.reload();
        });
    }

    function loadTodaySchedule() {
        const now = new Date();
        const dayName = daysOfWeek[now.getDay()];
        document.getElementById('currentDateDisplay').innerText = `${dayName}, ngày ${now.toLocaleDateString('vi-VN')}`;

        db.ref('weeklyScheduleData').once('value').then((snapshot) => {
            const data = snapshot.val();
            if (data) {
                let foundContent = "";
                // Duyệt qua các hàng trong Excel để tìm dòng chứa tên Thứ
                data.forEach(row => {
                    const rowText = row.join(" ");
                    if (rowText.toLowerCase().includes(dayName.toLowerCase())) {
                        foundContent += rowText + "\n";
                    }
                });

                document.getElementById('workContent').innerText = foundContent || "Không tìm thấy nội dung công tác cho hôm nay trong file Excel.";
            }
        });
    }

    loadTodaySchedule();
</script>

</body>
</html>
