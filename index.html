<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo dõi Công tác Tổ - v2.1</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .version { font-size: 0.8em; color: #7f8c8d; text-align: right; }
        .today-box { background: #e8f4fd; border-left: 5px solid #3498db; padding: 20px; margin: 20px 0; border-radius: 4px; }
        .today-date { font-weight: bold; color: #2980b9; font-size: 1.2em; }
        textarea { width: 100%; height: 150px; margin-top: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; }
        button { background-color: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #219150; }
        .hidden { display: none; }
        .edit-section { margin-top: 30px; border-top: 1px dashed #ccc; padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="version">Version: 2.1 (2026-01-03)</div>
    <h1>Lịch Công Tác Tổ</h1>

    <div id="displaySection" class="today-box">
        <div class="today-date" id="currentDateDisplay">Đang tải ngày...</div>
        <div id="workContent">Đang tải nội dung công việc...</div>
    </div>

    <button onclick="toggleEdit()">Cập nhật Lịch Tuần</button>

    <div id="editSection" class="edit-section hidden">
        <h3>Nhập lịch công tác tuần</h3>
        <p><small>Dán nội dung lịch tuần vào đây (Ví dụ: Thứ 2: Họp giao ban...)</small></p>
        <textarea id="weekInput" placeholder="Thứ Hai: ...&#10;Thứ Ba: ..."></textarea>
        <br>
        <button onclick="saveSchedule()">Lưu Lịch Mới</button>
    </div>
</div>

<script>
    // Cấu hình Firebase từ thông tin bạn đã cung cấp
    const firebaseConfig = { 
        apiKey: "AIzaSyCzWjfcD5Dgq7V-i2izb9tKLR6QM6qWPQo", 
        authDomain: "tavietnam-78ae8.firebaseapp.com", 
        projectId: "tavietnam-78ae8", 
        storageBucket: "tavietnam-78ae8.firebasestorage.app", 
        messagingSenderId: "670121705534", 
        appId: "1:670121705534:web:1027ad98550573ad37116f" 
    };

    // Khởi tạo Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const daysOfWeek = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
    
    function updateDisplay() {
        const now = new Date();
        const dayName = daysOfWeek[now.getDay()];
        const dateStr = now.toLocaleDateString('vi-VN');
        document.getElementById('currentDateDisplay').innerText = `${dayName}, ngày ${dateStr}`;

        // Lấy dữ liệu từ Firebase
        db.ref('weeklySchedule').once('value').then((snapshot) => {
            const data = snapshot.val();
            if (data) {
                // Tìm dòng có chứa tên thứ của ngày hôm nay
                const lines = data.split('\n');
                let todayTask = "Không có lịch công tác cụ thể cho hôm nay.";
                
                for (let line of lines) {
                    if (line.toLowerCase().includes(dayName.toLowerCase())) {
                        todayTask = line;
                        break;
                    }
                }
                document.getElementById('workContent').innerText = todayTask;
                document.getElementById('weekInput').value = data;
            }
        });
    }

    function toggleEdit() {
        const section = document.getElementById('editSection');
        section.classList.toggle('hidden');
    }

    function saveSchedule() {
        const content = document.getElementById('weekInput').value;
        db.ref('weeklySchedule').set(content).then(() => {
            alert("Đã cập nhật lịch tuần thành công!");
            toggleEdit();
            updateDisplay();
        });
    }

    // Chạy khi trang tải xong
    updateDisplay();
</script>

</body>
</html>
